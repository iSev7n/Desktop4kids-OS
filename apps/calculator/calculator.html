<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Calculator</title>
  <link rel="stylesheet" href="calculator.css" />
  <link rel="stylesheet" href="../../global-style.css">
</head>
<body>
  <div class="calc">
    <div class="top">
      <div class="tape" id="tape"></div>
      <input id="display" class="display" inputmode="numeric" autocomplete="off" spellcheck="false" />
    </div>

    <div class="keys">
      <button data-k="CE" class="danger">CE</button>
      <button data-k="C">C</button>
      <button data-k="←">←</button>
      <button data-k="÷">÷</button>

      <button data-k="7">7</button>
      <button data-k="8">8</button>
      <button data-k="9">9</button>
      <button data-k="×">×</button>

      <button data-k="4">4</button>
      <button data-k="5">5</button>
      <button data-k="6">6</button>
      <button data-k="−">−</button>

      <button data-k="1">1</button>
      <button data-k="2">2</button>
      <button data-k="3">3</button>
      <button data-k="+">+</button>

      <button data-k="±">±</button>
      <button data-k="0">0</button>
      <button data-k=".">.</button>
      <button data-k="=" class="accent">=</button>

      <button data-k="(">(</button>
      <button data-k=")">)</button>
      <button data-k="%">%</button>
      <button data-k="^">xʸ</button>
    </div>
  </div>

  <script src="calculator.js"></script>
</body>
</html>
