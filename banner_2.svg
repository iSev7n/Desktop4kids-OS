<svg viewBox="0 0 1000 150" xmlns="http://www.w3.org/2000/svg" style="width:100%; display:block;">
  <defs>
    <clipPath id="roundClip">
      <rect x="0" y="0" width="1000" height="150" rx="22" ry="22"/>
    </clipPath>

    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123BFF" stop-opacity="0.62"/>
      <stop offset="0.45" stop-color="#6D19E6" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#140015" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="auroraA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6DF0FF" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#6DF0FF" stop-opacity="0.55"/>
      <stop offset="0.7" stop-color="#B86BFF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#B86BFF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="auroraB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B86BFF" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#B86BFF" stop-opacity="0.55"/>
      <stop offset="0.7" stop-color="#6DF0FF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#6DF0FF" stop-opacity="0"/>
    </linearGradient>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="strongGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g clip-path="url(#roundClip)">
    <!-- Background -->
    <rect width="1000" height="150" fill="url(#sky)"/>

    <!-- Subtle vignette -->
    <ellipse cx="500" cy="75" rx="700" ry="220" fill="#000" opacity="0.18"/>

    <!-- Twinkling stars -->
    <g opacity="0.9">
      <circle cx="90" cy="30" r="1.6" fill="#fff">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="170" cy="58" r="1.2" fill="#fff">
        <animate attributeName="opacity" values="0.15;0.9;0.15" dur="3.1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="310" cy="24" r="1.4" fill="#fff">
        <animate attributeName="opacity" values="0.1;1;0.1" dur="2.7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="520" cy="36" r="1.3" fill="#fff">
        <animate attributeName="opacity" values="0.2;0.95;0.2" dur="3.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="760" cy="28" r="1.5" fill="#fff">
        <animate attributeName="opacity" values="0.1;1;0.1" dur="2.9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="905" cy="62" r="1.1" fill="#fff">
        <animate attributeName="opacity" values="0.2;0.85;0.2" dur="3.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="640" cy="18" r="1.1" fill="#fff">
        <animate attributeName="opacity" values="0.15;0.9;0.15" dur="2.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="420" cy="64" r="1.0" fill="#fff">
        <animate attributeName="opacity" values="0.1;0.8;0.1" dur="3.8s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Aurora ribbons -->
    <path d="M-80,115 C140,50 300,150 520,90 C710,38 820,130 1080,70 L1080,170 L-80,170 Z"
          fill="url(#auroraA)" opacity="0.65" filter="url(#strongGlow)">
      <animate attributeName="d"
               dur="7.5s" repeatCount="indefinite"
               values="
               M-80,115 C140,50 300,150 520,90 C710,38 820,130 1080,70 L1080,170 L-80,170 Z;
               M-80,105 C160,70 300,135 520,95 C720,55 840,120 1080,78 L1080,170 L-80,170 Z;
               M-80,115 C140,50 300,150 520,90 C710,38 820,130 1080,70 L1080,170 L-80,170 Z
               "/>
      <animate attributeName="opacity" values="0.45;0.78;0.45" dur="5.2s" repeatCount="indefinite"/>
    </path>

    <path d="M-60,130 C160,70 340,160 560,110 C760,65 860,140 1080,95 L1080,170 L-60,170 Z"
          fill="url(#auroraB)" opacity="0.55" filter="url(#strongGlow)">
      <animate attributeName="d"
               dur="9s" repeatCount="indefinite"
               values="
               M-60,130 C160,70 340,160 560,110 C760,65 860,140 1080,95 L1080,170 L-60,170 Z;
               M-60,120 C150,90 360,145 560,118 C760,80 880,130 1080,88 L1080,170 L-60,170 Z;
               M-60,130 C160,70 340,160 560,110 C760,65 860,140 1080,95 L1080,170 L-60,170 Z
               "/>
      <animate attributeName="opacity" values="0.35;0.7;0.35" dur="6.1s" repeatCount="indefinite"/>
    </path>

    <!-- Text -->
    <text x="50%" y="62" dominant-baseline="middle" text-anchor="middle"
          font-family="Segoe UI, Arial, sans-serif"
          font-size="46"
          font-weight="650"
          fill="white"
          filter="url(#softGlow)">
      See More Below
    </text>

    <!-- Border highlight -->
    <rect x="2" y="2" width="996" height="146" rx="20" ry="20"
          fill="none" stroke="#fff" opacity="0.12"/>
  </g>
</svg>
